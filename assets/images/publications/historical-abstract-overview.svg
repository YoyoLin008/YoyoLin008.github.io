<rect width="640" height="420" rx="20" fill="url(#bg)"/>
<g font-family="Arial, sans-serif"><text x="32" y="40" font-size="12" letter-spacing="2" fill="#227b74">SEMANTIC NOVELTY</text><text x="32" y="73" font-size="24" font-weight="700" fill="#233b38">When historical abstracts disappear</text>
<rect x="32" y="102" width="576" height="42" rx="10" fill="#fff" stroke="#d2e1dd"/><circle cx="54" cy="123" r="5" fill="#16877b"/><text x="70" y="128" font-size="15" fill="#36534e">Focal paper: title + abstract held fixed</text>
