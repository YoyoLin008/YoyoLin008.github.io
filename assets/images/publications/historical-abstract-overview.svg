<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Historical abstract loss: study overview</title><desc id="desc">The focal paper stays fixed while historical papers with abstracts are compared with title-only representations. The study examines scores, rankings and selections. Conceptual illustration, not experimental results.</desc>
